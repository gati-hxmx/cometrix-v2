# AI を自動で起動する（docs/workflow.md の「3. 起動のきっかけ」）。
# サブスクで動かすため、Secret CLAUDE_CODE_OAUTH_TOKEN（手元で `claude setup-token`）を使う。API キーは使わない。
# 通知用に Secret DISCORD_WEBHOOK_URL を AI の環境に渡す（scripts/notify が使う）。
name: Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "0 22 * * *"   # 毎日 7:00（日本時間）groom
    - cron: "0 23 * * 0"   # 毎週月曜 8:00（日本時間）retro
  workflow_dispatch:
    inputs:
      task:
        description: "groom・retro、または見張り（watchdog.yml）が使う claude-review・advance"
        required: true
        default: groom
      pr:
        description: "claude-review・advance で進める PR の番号"
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

# 同じ Issue・PR で AI が同時に2つ動かないようにする。
concurrency:
  group: agent-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_branch || inputs.pr || github.event.schedule || github.run_id }}
  cancel-in-progress: false

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  # prompt で起動した claude-code-action は .claude/settings.json の allow を使わず、
  # ここで渡したツールだけを許可する（docs: claude_args --allowedTools）。
  # 危ない操作は .claude/settings.json の deny と hooks が引き続き止める。
  CLAUDE_ALLOWED_TOOLS: "Edit,Write,MultiEdit,Read,Glob,Grep,Skill,TodoWrite,WebSearch,WebFetch,Bash(scripts/check),Bash(scripts/check:*),Bash(scripts/notify:*),Bash(scripts/ai:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh run:*),Bash(gh label:*),Bash(gh repo view:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(grep:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(chmod:*),Bash(touch:*),Bash(cd:*),Bash(pwd),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(python3:*),Bash(pip:*),Bash(pip3:*),Bash(docker:*)"

jobs:
  # Issue に agent ラベルが付いたら、triage から自走ワークフローを始める。
  start:
    if: github.event_name == 'issues' && github.event.label.name == 'agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --allowedTools "${{ env.CLAUDE_ALLOWED_TOOLS }}"
          # groom が起こした Issue（Claude の bot が付けた agent ラベル）でも始められるようにする。
          allowed_bots: claude
          prompt: |
            Issue #${{ github.event.issue.number }} を、AGENTS.md と docs/workflow.md に従って自走で進めてください。
            triage スキルから始め、各スキルの「次に呼ぶスキル」に従って、PR の作成と別の AI へのレビュー依頼（ship）まで進めます。
            Issue に `codex` ラベルを付けた場合は、triage スキルのとおり Issue に `@codex` で作業を頼むコメントをして終えます（24時間たっても Codex の PR がなければ groom が Claude に引き継ぎます）。
            人に判断を仰ぐのは escalate スキルの条件に当てはまるときだけです。
      - name: 権限で断られた操作（ツール名だけ）
        if: always()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          items = data if isinstance(data, list) else [data]
          for m in items:
              if isinstance(m, dict) and m.get("type") == "result":
                  for d in m.get("permission_denials") or []:
                      name = d.get("tool_name", "?")
                      cmd = (d.get("tool_input") or {}).get("command", "")
                      print(f"::warning::断られた操作: {name} {cmd.split()[0] if cmd else ''}")
          PY

  # コメント・レビュー本文で @claude と呼ばれたとき、または Claude の PR にレビューが付いたとき。
  # Codex のレビュー（bot）にも反応できるよう、Codex の bot 名を許可する（リポジトリ変数 CODEX_BOT_LOGIN で変更可）。
  respond:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && startsWith(github.event.pull_request.head.ref, 'claude/')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --allowedTools "${{ env.CLAUDE_ALLOWED_TOOLS }}"
          trigger_phrase: "@claude"
          allowed_bots: ${{ vars.CODEX_BOT_LOGIN || 'chatgpt-codex-connector' }}
          # 「 #」は YAML ではコメントの始まりになるので、式は折りたたみの書き方（>-）で渡す。
          prompt: >-
            ${{ github.event_name == 'pull_request_review' && startsWith(github.event.pull_request.head.ref, 'claude/') && format('PR #{0} にレビューが付きました。AGENTS.md に従い、必須の指摘があれば address スキル、なければ merge-gate スキルを使ってください。往復の回数（2回まで）を守ってください。', github.event.pull_request.number) || '' }}
      - name: 権限で断られた操作（ツール名だけ）
        if: always()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          items = data if isinstance(data, list) else [data]
          for m in items:
              if isinstance(m, dict) and m.get("type") == "result":
                  for d in m.get("permission_denials") or []:
                      name = d.get("tool_name", "?")
                      cmd = (d.get("tool_input") or {}).get("command", "")
                      print(f"::warning::断られた操作: {name} {cmd.split()[0] if cmd else ''}")
          PY

  # 作業ブランチの CI が失敗したら fix-ci。回数の上限（3回）は fix-ci スキルが守る。
  fix-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --allowedTools "${{ env.CLAUDE_ALLOWED_TOOLS }}"
          # 作業ブランチへの push は Claude の bot が行うので、その CI の失敗でも動けるようにする。
          allowed_bots: claude
          additional_permissions: |
            actions: read
          prompt: |
            ブランチ ${{ github.event.workflow_run.head_branch }} の CI が失敗しました（実行: ${{ github.event.workflow_run.html_url }}）。
            AGENTS.md に従い、fix-ci スキルで原因を再現して直し、同じブランチに push してください。
            この PR で fix-ci が3回続けて失敗している場合は、直さずに escalate スキルを使ってください。
      - name: 権限で断られた操作（ツール名だけ）
        if: always()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          items = data if isinstance(data, list) else [data]
          for m in items:
              if isinstance(m, dict) and m.get("type") == "result":
                  for d in m.get("permission_denials") or []:
                      name = d.get("tool_name", "?")
                      cmd = (d.get("tool_input") or {}).get("command", "")
                      print(f"::warning::断られた操作: {name} {cmd.split()[0] if cmd else ''}")
          PY

  # 定期実行：毎日 groom、毎週 retro。見張り（watchdog.yml）からの再開もここで動く。
  scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 頼む内容を決める
        id: task
        env:
          TASK: ${{ github.event.schedule == '0 23 * * 0' && 'retro' || inputs.task || 'groom' }}
          PR: ${{ inputs.pr }}
        run: |
          case "$TASK" in
            retro) p="AGENTS.md に従い、retro スキルで過去1週間を振り返り、改善 PR と週の報告を出してください。" ;;
            claude-review) p="PR #$PR で Codex のレビューが始まらないため、自動の見張りが代わりを頼みました。AGENTS.md の「片方が使えないときはもう一方が代わりに行う」に従い、review スキルでこの PR をレビューし、結果を PR にコメントしてください（Codex の代わりであることを書き、gh pr review は使わない）。続けて、必須の指摘があれば address スキル、なければ merge-gate スキルで進めてください。" ;;
            advance) p="PR #$PR はレビューのあと30分以上動きがないため、自動の見張りが再開を頼みました。PR のコメントとレビューを読み、必須の指摘が残っていれば address スキル、なければ merge-gate スキルで進めてください。往復の回数（2回まで）を守り、人の判断が要るときは escalate スキルを使ってください。" ;;
            *) p="AGENTS.md に従い、groom スキルで保留中の Issue の再開とタスクの発掘をしてください。" ;;
          esac
          echo "prompt=$p" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 見張り（watchdog.yml）が GITHUB_TOKEN で起動するので、github-actions の bot を許可する
          allowed_bots: "github-actions,github-actions[bot]"
          claude_args: --allowedTools "${{ env.CLAUDE_ALLOWED_TOOLS }}"
          prompt: ${{ steps.task.outputs.prompt }}
      - name: 権限で断られた操作（ツール名だけ）
        if: always()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          items = data if isinstance(data, list) else [data]
          for m in items:
              if isinstance(m, dict) and m.get("type") == "result":
                  for d in m.get("permission_denials") or []:
                      name = d.get("tool_name", "?")
                      cmd = (d.get("tool_input") or {}).get("command", "")
                      print(f"::warning::断られた操作: {name} {cmd.split()[0] if cmd else ''}")
          PY
